<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우연 시리즈 : 우연한 그림</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 타이틀 스타일 */
        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        /* 룰렛 카드 3개 컨테이너 */
        .card-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .slot-card {
            flex: 1;
            aspect-ratio: 1 / 1;
            background-color: #A3B5AC;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(163, 181, 172, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        /* 카드가 멈출 때 살짝 강조되는 효과 */
        .slot-card.locked {
            background-color: #8E9E95;
            transform: scale(1.03);
        }

        /* 제시된 키워드 박스 */
        .result-box {
            background-color: #68706C;
            color: #ffffff;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            margin-bottom: 25px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(104, 112, 108, 0.3);
            transition: transform 0.2s ease;
        }

        .result-box:hover {
            transform: scale(1.02);
        }

        .result-box h3 {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .result-box p {
            font-size: 0.9rem;
            color: #e0e0e0;
        }

        /* 드로잉 이미지 및 설명 확장 영역 */
        .drawing-detail-panel {
            background-color: #f9f9f9;
            border: 2px solid #68706C;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            margin-bottom: 25px;
            text-align: left;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #000;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawing-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #eee;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawing-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drawing-info h4 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #111;
        }

        .drawing-info p {
            font-size: 0.9rem;
            color: #444;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            background-color: #A3B5AC;
            color: #ffffff;
            border: none;
            padding: 15px 0;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(163, 181, 172, 0.3);
            transition: background-color 0.2s;
        }

        .action-btn:hover:not(:disabled) {
            background-color
